<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Browser Control — on, no connection</title>
  <!-- Same filled bridge as `bridge.svg`; see there for why it must not be stroked. -->
  <g fill="context-fill">
    <rect x="2" y="12" width="28" height="4" />
    <rect x="8" y="16" width="4" height="13" />
    <rect x="20" y="16" width="4" height="13" />
    <path d="M8 12a8 8 0 0 1 16 0h-4a4 4 0 0 0-8 0z" />
  </g>
  <!-- Yellow, not red: "on but not reachable" is a warning, not a refusal. -->
  <path d="M18.5 2 9 18h5.5L13 30l9.5-16h-5.5z" fill="#ffcc00" />
</svg>
