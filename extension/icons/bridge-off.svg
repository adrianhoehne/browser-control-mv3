<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Browser Control — off</title>
  <!-- Same filled bridge as `bridge.svg`; see there for why it must not be stroked. -->
  <g fill="context-fill">
    <rect x="2" y="12" width="28" height="4" />
    <rect x="8" y="16" width="4" height="13" />
    <rect x="20" y="16" width="4" height="13" />
    <path d="M8 12a8 8 0 0 1 16 0h-4a4 4 0 0 0-8 0z" />
  </g>
  <!-- The cross is the state, not decoration: red is the one colour the toolbar
       does not use for anything else. Drawn as two rotated bars rather than two
       strokes, so the whole icon follows one drawing rule. -->
  <g fill="#d70022">
    <rect x="13.5" y="1" width="5" height="30" transform="rotate(45 16 16)" />
    <rect x="13.5" y="1" width="5" height="30" transform="rotate(-45 16 16)" />
  </g>
</svg>
