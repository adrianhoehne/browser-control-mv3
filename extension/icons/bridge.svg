<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Browser Control — connected</title>
  <!-- context-fill is what keeps a toolbar icon legible on a light and a dark
       theme alike; a hard-coded colour would vanish on one of them. -->
  <g fill="none" stroke="context-fill" stroke-width="3" stroke-linecap="round">
    <path d="M3 13h26" />
    <path d="M8 14v15" />
    <path d="M24 14v15" />
    <path d="M8 14c1.5-6 5-9 8-9s6.5 3 8 9" />
  </g>
</svg>
