<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Browser Control — connected</title>
  <!-- Filled shapes, not strokes. Firefox resolves `context-fill` for a toolbar icon
       through the `fill` property only; `-moz-context-properties` is not set to
       `stroke` there. A stroked bridge with `stroke="context-fill"` therefore stays
       invisible — which is exactly how this icon first shipped, and why
       `test/manifest.test.js` pins the fill.
       The colour itself has to come from the theme, or the bridge vanishes on one of
       two; the state markings carry hard colours because their meaning is the colour. -->
  <g fill="context-fill">
    <!-- Deck -->
    <rect x="2" y="12" width="28" height="4" />
    <!-- Two piers, flush under the arch feet -->
    <rect x="8" y="16" width="4" height="13" />
    <rect x="20" y="16" width="4" height="13" />
    <!-- One arch: outer radius 8, inner radius 4, standing on the deck's top edge -->
    <path d="M8 12a8 8 0 0 1 16 0h-4a4 4 0 0 0-8 0z" />
  </g>
</svg>
